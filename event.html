<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#dde3ec;--pri:#1b3a6b;--pri2:#e4ebf6;--warn:#92400e;--warnbg:#fef3c7;--err:#b91c1c}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 120px}
header.ev{background:#1b3a6b;color:#fff;padding:12px 16px;margin:0 -16px;position:sticky;top:0;z-index:5}
header.ev .t{font-weight:700;font-size:17px}
header.ev .s{font-size:12px;opacity:.92;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
header.ev a{color:#fff;text-decoration:underline;cursor:pointer}
.pill{background:rgba(255,255,255,.18);border-radius:99px;padding:1px 10px}
.pill.off{background:#b45309}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0 4px}
.tabs button,.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on,.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:flex;gap:6px}
.seg button{padding:7px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.req{color:var(--err)}
input[type=text],input[type=tel],input[type=email],input[type=password],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px;user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pj{font-size:13px;font-weight:700;margin:10px 0 6px;color:var(--pri)}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.link{background:none;color:var(--pri);margin-top:6px;padding:8px;font-size:14px;text-decoration:underline}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;margin:0 4px 2px 0}
.t-pre{background:#e0e7ff;color:#1e3a8a}.t-walk{background:#fef3c7;color:#92400e}
.t-warn{background:#fef3c7;color:#92400e}.t-ag{background:#ede9fe;color:#5b21b6}.t-in{background:#dcfce7;color:#166534}.t-no{background:#f3f4f6;color:#6b7280}
@media (prefers-color-scheme:dark){.t-warn{background:#78350f;color:#fde68a}.t-pre{background:#1e3a8a;color:#c7d2fe}.t-walk{background:#78350f;color:#fde68a}.t-ag{background:#4c1d95;color:#ddd6fe}.t-in{background:#14532d;color:#bbf7d0}.t-no{background:#374151;color:#d1d5db}}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
.note{border-left:3px solid var(--pri);background:var(--bg);border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap}
.note .by{font-size:12px;color:var(--mut);margin-bottom:2px}
.note b{font-size:12px;color:var(--mut);font-weight:600}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.info span:nth-child(odd){color:var(--mut)}
.big{font-size:44px;font-weight:800;line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
th,td{padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr.tot td{font-weight:700;border-bottom:0}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:12px;color:var(--mut)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;color:var(--mut)}
.consent input{margin-top:5px;width:20px;height:20px;flex:none}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cinbtn{flex:none;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:10px 14px;cursor:pointer;font-size:14px}
.cinbtn:disabled{opacity:.45}
.okmark{flex:none;color:#166534;font-weight:700;font-size:13px}
@media (prefers-color-scheme:dark){.okmark{color:#86efac}}
.row{border-bottom:1px solid var(--line);padding:12px 0}
.row:last-child{border:0}
.row .n{font-weight:600}.row .m{font-size:13px;color:var(--mut)}
.lab{font-weight:600;font-size:13px;margin:10px 0 4px;color:var(--mut)}
.flt{display:flex;gap:6px;margin-top:10px}
.flt button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.flt button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.save{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;z-index:6}
.save .in{max-width:480px;margin:0 auto}
.save .btn{margin:0;font-size:17px;padding:15px}
.stepper{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--pri);font:inherit;font-size:24px;font-weight:700;cursor:pointer}
.stepper b{font-size:26px;min-width:34px;text-align:center}
.gbox{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.gbox .gt{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:4px}
.newbox input{margin-bottom:8px}
.loading{text-align:center;color:var(--mut);padding:60px 0}
.err{color:var(--err);font-size:13px;margin-top:8px}
.gate{max-width:380px;margin:60px auto;padding:0 16px}
.nick{font-weight:400;color:var(--mut)}
.pdpa{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;margin-top:6px;font-size:13px}
.pdpa .pt{font-weight:700;color:var(--pri);margin-bottom:6px}
.pdpa .px{max-height:180px;overflow:auto;white-space:pre-wrap;line-height:1.6}
.pdpa .pb{display:flex;gap:8px;margin-top:10px}
.pdpa .pb .btn{margin:0;padding:12px;font-size:15px}
.pdpa.ok{border-color:#16a34a}
.pdpa.ok .pt{color:#166534}
@media (prefers-color-scheme:dark){.pdpa.ok .pt{color:#86efac}}
.phbtns{display:flex;gap:8px;margin-top:8px}
.phbtns label{flex:1;margin:0;text-align:center;padding:12px 6px;border-radius:12px;background:var(--pri2);color:var(--pri);font-weight:700;font-size:15px;cursor:pointer}
.phbtns input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:24px;padding:0;cursor:pointer}
.thumb .nw{position:absolute;left:3px;bottom:3px;background:#f59e0b;color:#000;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.camtag{font-size:12px;color:var(--mut);margin-left:4px}
</style>
</head>

 '1. เพื่อให้เจ้าหน้าที่ฝ่ายขายจดจำและให้บริการข้าพเจ้าได้อย่างถูกต้อง\n'+
 '2. เพื่อประกอบการติดต่อกลับและติดตามการให้บริการเกี่ยวกับโครงการของบริษัทฯ\n\n'+
 'ภาพถ่ายจะใช้ภายในบริษัทฯ เท่านั้น จะไม่นำไปเผยแพร่ต่อสาธารณะหรือใช้เพื่อการโฆษณา และจะเก็บไว้เท่าที่จำเป็นตามวัตถุประสงค์ข้างต้น ตามนโยบายคุ้มครองข้อมูลส่วนบุคคลของบริษัทฯ\n\n'+
 'ข้าพเจ้าทราบว่าการให้ความยินยอมนี้เป็นไปโดยสมัครใจ ไม่ยินยอมก็ยังรับบริการได้ตามปกติ และสามารถขอถอนความยินยอม ขอเข้าถึง หรือขอให้ลบภาพถ่ายได้ทุกเมื่อ โดยแจ้งเจ้าหน้าที่ของบริษัทฯ';
function typeLabel(t){return t===AG?'Property Agent':'ลูกค้า'}

var params=new URLSearchParams(location.search);
var TEST=params.get('test')==='1';
var COLL=TEST?'event_guests_test':'event_guests';

/* ---------- State ---------- */
var S={user:null,me:'',isAdmin:false,view:'desk',open:null,newOpen:false,flt:'all',q:'',dashDay:'all',type:CU,showAll:false,
  nh:[],nb:'',nm:'',np:1,today:null,todayMsg:'',offsetMs:0,online:true,pending:false,ready:false,err:'',imp:null,noRestore:false,

var G=[]; // guests from Firestore

/* ---------- Helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function digits(s){return String(s||'').replace(/\D/g,'')}
function normPhone(s){var d=digits(s);if(d.indexOf('66')===0&&d.length===11)d='0'+d.slice(2);if(d.length===9&&d.charAt(0)!=='0')d='0'+d;return d}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},2400)}
function nowMs(){return Date.now()+S.offsetMs}
function nowIso(){return new Date(nowMs()).toISOString()}

function bangkokDate(ms){return new Date(ms).toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})}
function computeToday(){
  var forced=params.get('day');
  if(S.isAdmin&&(forced==='20'||forced==='21')){S.today=forced;S.todayMsg='โหมดทดสอบ (ผู้ดูแล): ตั้งวันเป็น '+DAYS[forced].label;return}

  Object.keys(DAYS).forEach(function(k){if(DAYS[k].date===d)found=k});

}

/* ย่อ + บีบอัดรูปในเครื่องก่อนบันทึก ให้ไฟล์เล็กพอเก็บใน Firestore */
function compressImage(file){
  return new Promise(function(res,rej){
    if(!file||!/^image\//.test(file.type||'image/'))return rej(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,PHOTO_MAX_EDGE/Math.max(w,h));
      var draw=function(scale){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c};
      var c=draw(s),q=0.78,d=c.toDataURL('image/jpeg',q);
      while(d.length>PHOTO_MAX_BYTES&&q>0.4){q-=0.08;d=c.toDataURL('image/jpeg',q)}
      while(d.length>PHOTO_MAX_BYTES&&s>0.2){s*=0.8;c=draw(s);d=c.toDataURL('image/jpeg',0.6)}
      URL.revokeObjectURL(url);res(d);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('เปิดรูปนี้ไม่ได้ (ลองถ่ายใหม่ หรือเลือกไฟล์ JPG/PNG)'))};
    img.src=url;
  });
}

/* กล่อง PDPA + ปุ่มถ่ายรูป/แนบรูป  (g = ลูกค้าที่เปิดอยู่ หรือ null ถ้าเป็นฟอร์มเพิ่มใหม่) */
function photoSection(g){

function addPhotoFiles(files){
  var g=S.open?byId(S.open):null,room=MAX_PHOTOS-((g&&g.photos)||[]).length-S.ph.length;

  if(!list.length)return;
  S.busy=true;render();

/* ---------- Data layer (Firestore) ---------- */
function ref(id){return db.collection(COLL).doc(id)}
function hashStr(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function guestId(phone){return 'g_'+phone}
// Guest without a usable phone gets a stable id from type+name so re-importing never duplicates them
function guestIdFor(phone,type,nm){return phone&&phone.length>=9?'g_'+phone:'gn_'+hashStr(type+'|'+String(nm||'').toLowerCase().replace(/\s+/g,''))}
var CO_RE=/บริษัท|บจก|บมจ|หจก|ห้างหุ้นส่วน|จำกัด|\bco\.?\b|ltd|limited|\binc\b|corp|group|กรุ๊ป|เรียล|realty|real estate|property|พร็อพ|เอเจนซี|agency|holding|development/i;
function phoneTxt(g){return g.phone||('ไม่มีเบอร์'+(g.rawPhone?' (ที่กรอกมา: '+g.rawPhone+')':''))}
function FV(){return firebase.firestore.FieldValue}
function doCheckin(g,day,pax){
  if(!S.today)return Promise.reject(new Error('ไม่ใช่วันงาน'));
  var u={};u['checkins.'+day]={pax:pax,by:S.me,at:nowIso()};
  return ref(g.id).update(u);
}
function doSaveNote(g,o){
  var u={},note={by:S.me,at:nowIso(),detail:o.detail||'',interest:o.interest||'',houses:o.houses||[],budgetSet:o.budgetSet||''};
  var has=note.detail||note.interest||note.houses.length||note.budgetSet;
  if(has)u.notes=FV().arrayUnion(note);
  if(o.budgetSet){u.budget=o.budgetSet;u.budgetBy=S.me;u.budgetAt=nowIso()}
  if(o.media!==undefined)u.media=o.media;
  if(o.phone){u.phone=o.phone;u.noPhone=false}
  if(g.type===AG){u.name=o.name||'';u.company=o.company||''}
  if(o.nickname!==undefined&&o.nickname!==(g.nickname||''))u.nickname=o.nickname;
  if(o.photoConsent)u.photoConsent=o.photoConsent;
  if(o.photos&&o.photos.length)u.photos=FV().arrayUnion.apply(null,o.photos);
  if(o.checkinDay)u['checkins.'+o.checkinDay]={pax:o.pax,by:S.me,at:nowIso()};
  u.updatedAt=nowIso();u.updatedBy=S.me;
  return ref(g.id).update(u);
}
function doCreateWalkin(o){
  var id=guestId(o.phone);
  return ref(id).get().then(function(snap){
    if(snap.exists){
      // เบอร์นี้มีอยู่แล้ว: ไม่ทับข้อมูลเดิม แต่เก็บชื่อเล่น (ถ้ายังไม่มี) รูป และการยินยอมที่เพิ่งได้มาไว้ด้วย
      var cur=snap.data()||{},u={};
      if(o.nickname&&!cur.nickname)u.nickname=o.nickname;
      if(o.photoConsent&&!(cur.photoConsent&&cur.photoConsent.given))u.photoConsent=o.photoConsent;
      if(o.photos&&o.photos.length){var room=MAX_PHOTOS-(cur.photos||[]).length;if(room>0)u.photos=FV().arrayUnion.apply(null,o.photos.slice(0,room))}
      if(!Object.keys(u).length)return {existing:true,id:id};
      u.updatedAt=nowIso();u.updatedBy=S.me;
      return ref(id).update(u).then(function(){return {existing:true,id:id}});
    }
    var d={type:o.type,name:o.name,nickname:o.nickname||'',company:o.company||'',phone:o.phone,photos:o.photos||[],src:'walk',prefDate:'',slots:{},pax:o.pax,media:o.media||'',budget:o.budget||'',budgetBy:o.budget?S.me:'',budgetAt:o.budget?nowIso():'',
      checkins:{},notes:[],pdpa:{source:'onsite',by:S.me,at:nowIso()},createdBy:S.me,createdAt:nowIso()};
    if(o.photoConsent)d.photoConsent=o.photoConsent;
    if(S.today)d.checkins[S.today]={pax:o.pax,by:S.me,at:nowIso()};
    if(o.budget)d.notes=[{by:S.me,at:nowIso(),detail:'',interest:'',houses:[],budgetSet:o.budget}];
    return ref(id).set(d).then(function(){return {existing:false,id:id}});
  });
}

function parseCSV(text){
  var rows=[],row=[],f='',q=false;text=text.replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(function(x){return x!==''}))rows.push(row);row=[]}else f+=c}}
  row.push(f);if(row.some(function(x){return x!==''}))rows.push(row);return rows;
}
function mapHeaders(hdr){
  var m={type:-1,name:-1,phone:-1,pref:-1,slot20:-1,slot21:-1,slotRaw:[],pax:-1,media:-1,pdpa:-1};
  hdr.forEach(function(h,i){
    var t=String(h);
    if(m.type<0&&/Registrant Type|ประเภทผู้ลงทะเบียน/i.test(t))m.type=i;
    else if(m.phone<0&&/Phone|เบอร์โทร/i.test(t))m.phone=i;
    else if(m.pref<0&&/Preferred Date|วันที่สะดวก/i.test(t))m.pref=i;
    else if(m.name<0&&/Full Name|Company Name|ชื่อ/i.test(t)&&!/ช่องทาง|How Did/i.test(t))m.name=i;
    else if(/time slot|ช่วงเวลา/i.test(t)){if(m.slot20<0&&/ศุกร์|Friday/i.test(t))m.slot20=i;else if(m.slot21<0&&/เสาร์|Saturday/i.test(t))m.slot21=i;else m.slotRaw.push(i)}
    else if(m.pax<0&&/How many|จำนวนผู้เข้าร่วม/i.test(t))m.pax=i;
    else if(m.media<0&&/How Did You Hear|ช่องทางที่ได้รับ/i.test(t))m.media=i;
    else if(m.pdpa<0&&/ยินยอม|consent|PDPA|พ.ร.บ.|คุ้มครองข้อมูล/i.test(t))m.pdpa=i;
  });
  return m;
}
function buildImport(text){
  var rows=parseCSV(text);if(rows.length<2)return {error:'ไฟล์ไม่มีข้อมูล (มีแต่หัวคอลัมน์หรือว่างเปล่า)'};
  var m=mapHeaders(rows[0]);
  if(m.phone<0||m.name<0)return {error:'หาคอลัมน์ "ชื่อ" หรือ "เบอร์โทร" ไม่เจอ — ตรวจว่าเป็นไฟล์คำตอบจาก Google Form ที่ส่งออกเป็น CSV'};
  var existing={};G.forEach(function(g){existing[g.id]=1});
  var seen={},add=[],dupInFile=0,dupExisting=0,bad=[],noPhone=0;
  rows.slice(1).forEach(function(r,idx){
    var rawP=String(r[m.phone]||'').trim(),phone=normPhone(rawP),name=String(r[m.name]||'').trim();
    if(!name){bad.push('แถว '+(idx+2)+': (ไม่มีชื่อ) / '+(rawP||'(ไม่มีเบอร์)'));return}
    var okP=phone.length>=9&&phone.length<=11;if(!okP)phone='';
    var tt=String(r[m.type]||''),isAg=/agent/i.test(tt);
    var gid=guestIdFor(phone,isAg?AG:CU,name);
    if(existing[gid]){dupExisting++;return}
    if(seen[gid]){dupInFile++;return}seen[gid]=1;
    if(!okP)noPhone++;
    var isCo=isAg&&CO_RE.test(name);
    var pr=String(r[m.pref]||''),pref='';
    if(/both|ทั้งสอง/i.test(pr)||(/20/.test(pr)&&/21/.test(pr)))pref='both';else if(/Friday|ศุกร์|20/.test(pr))pref='20';else if(/Saturday|เสาร์|21/.test(pr))pref='21';
    var slots={};if(m.slot20>=0&&r[m.slot20])slots['20']=String(r[m.slot20]).trim();if(m.slot21>=0&&r[m.slot21])slots['21']=String(r[m.slot21]).trim();
    if(!slots['20']&&!slots['21']){var raw=m.slotRaw.map(function(i){return String(r[i]||'').trim()}).filter(Boolean)[0];if(raw){if(pref==='21')slots['21']=raw;else slots['20']=raw}}
    var pax=m.pax>=0?parseInt(String(r[m.pax]).replace(/[^\d]/g,''),10):1;if(!(pax>0))pax=1;
    var hasP=m.pdpa>=0&&String(r[m.pdpa]||'').trim()!=='';
    add.push({_id:gid,noPhone:!okP,rawPhone:okP?'':rawP,type:isAg?AG:CU,name:isAg&&isCo?'':name,company:isCo?name:'',phone:phone,src:'pre',prefDate:pref,slots:slots,pax:pax,media:m.media>=0?String(r[m.media]||'').trim():'',budget:'',budgetBy:'',budgetAt:'',checkins:{},notes:[],pdpa:{source:hasP?'form':'none'},createdBy:S.me,createdAt:nowIso(),importedAt:nowIso()});
  });
  return {add:add,noPhone:noPhone,dupInFile:dupInFile,dupExisting:dupExisting,bad:bad,total:rows.length-1,map:m,hdr:rows[0]};
}

function exportCSV(){
  var cols=['ประเภท','ที่มา','ชื่อ','ชื่อเล่น','บริษัท','เบอร์','วันที่สะดวก','ช่วงเวลา','ลงทะเบียน(คน)','มา 20 พ.ย.(คน)','มา 21 พ.ย.(คน)','ช่องทาง','งบประมาณ','แบบบ้าน','บันทึก','รูปถ่าย(รูป)','ยินยอมถ่ายรูป (PDPA)'];
  var q=function(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"'};
  var lines=[cols.map(q).join(',')];
  G.forEach(function(g){lines.push([typeLabel(g.type),g.src==='pre'?'ลงทะเบียนล่วงหน้า':'Walk-in',g.name,g.nickname||'',g.company,"'"+g.phone,PD[g.prefDate]||'',slotsText(g),g.pax||1,pin(g,'20')||'',pin(g,'21')||'',g.media,g.budget,allHouses(g).map(hl).join('; '),(g.notes||[]).map(function(n){return n.by+' '+fmtStamp(n.at)+': '+[n.detail,n.interest].filter(Boolean).join(' / ')}).join(' || '),(g.photos||[]).length||'',g.photoConsent&&g.photoConsent.given?('ยินยอม '+fmtStamp(g.photoConsent.at)+' โดย '+(g.photoConsent.by||'')):''].map(q).join(','))});
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='event_guests_'+bangkokDate(nowMs())+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- Events ---------- */
function fail(e){console.error(e);toast('บันทึกไม่สำเร็จ: '+(e&&e.message?e.message:e))}
document.addEventListener('click',function(e){
  var t=e.target,x;
  if((x=t.closest('.viewer'))){x.remove();return}
  if((x=t.closest('[data-view]'))){var v=document.createElement('div');v.className='viewer';v.innerHTML='<img src="'+esc(x.getAttribute('src'))+'" alt="รูปลูกค้า">';document.body.appendChild(v);return}
  if(t.id==='pcYes'){S.pc='yes';render();toast('ลูกค้ายินยอมแล้ว ถ่าย/แนบรูปได้เลย');return}
  if(t.id==='pcNo'){S.pc='no';S.ph=[];render();return}
  if(t.id==='pcReset'){S.pc='';render();return}
  if((x=t.closest('[data-delnew]'))){S.ph.splice(+x.dataset.delnew,1);render();return}
  if((x=t.closest('[data-delsaved]'))){var gp=byId(S.open);if(!gp)return;if(!confirm('ลบรูปนี้ออกจากข้อมูลลูกค้า?'))return;
    doDeletePhoto(gp,+x.dataset.delsaved).then(function(){toast('ลบรูปแล้ว')}).catch(fail);return}
  if(t.id==='logout'){if(unsub){unsub();unsub=null}auth.signOut();return}
  if((x=t.closest('#tabs button'))){if(S.ph.length&&!confirm('มีรูปที่ยังไม่บันทึก ออกจากหน้านี้เลยไหม?'))return;S.view=x.dataset.v;S.open=null;S.newOpen=false;resetPhotoState();S.noRestore=true;render();return}
  if((x=t.closest('[data-f]'))){S.flt=x.dataset.f;render();return}
  if((x=t.closest('[data-dd]'))){S.dashDay=x.dataset.dd;render();return}
  if((x=t.closest('[data-cin]'))){var g=byId(x.dataset.cin);if(!g||!S.today)return toast(S.todayMsg||'ไม่ใช่วันงาน');
    doCheckin(g,S.today,g.pax||1).then(function(){toast('เช็คอิน '+guestName(g)+' · '+(g.pax||1)+' คน ✓')}).catch(fail);return}
  if((x=t.closest('[data-pick]'))){var g2=byId(x.dataset.pick);if(!g2)return;S.open=g2.id;S.nh=[];S.nb=g2.budget||'';S.nm=g2.media||'';S.np=(S.today&&pin(g2,S.today))||g2.pax||1;resetPhotoState();S.noRestore=true;render();window.scrollTo(0,0);return}
  if(t.id==='backList'||t.id==='fCancel'){if(S.ph.length&&!confirm('มีรูปที่ยังไม่บันทึก ออกจากหน้านี้เลยไหม?'))return;S.open=null;S.newOpen=false;resetPhotoState();S.noRestore=true;render();window.scrollTo(0,0);return}
  if(t.id==='newBtn'){S.newOpen=true;S.open=null;S.type=CU;S.np=1;S.nm='';S.nb='';resetPhotoState();render();return}
  if(t.id==='showAll'){S.showAll=true;render();return}
  if(t.id==='npMinus'||t.id==='npPlus'){S.np=Math.max(1,S.np+(t.id==='npPlus'?1:-1));$('npVal').textContent=S.np;return}
  if((x=t.closest('#nMedia .chip'))){S.nm=S.nm===x.dataset.m?'':x.dataset.m;[].forEach.call(document.querySelectorAll('#nMedia .chip'),function(b){b.classList.toggle('on',b.dataset.m===S.nm)});return}
  if((x=t.closest('#nBudget .chip'))){S.nb=S.nb===x.dataset.b?'':x.dataset.b;[].forEach.call(document.querySelectorAll('#nBudget .chip'),function(b){b.classList.toggle('on',b.dataset.b===S.nb)});return}
  if((x=t.closest('#nHouse .chip'))){var k=x.dataset.h,i=S.nh.indexOf(k);if(i>-1)S.nh.splice(i,1);else S.nh.push(k);x.classList.toggle('on');return}
  if((x=t.closest('#fType .chip'))){S.type=x.dataset.v;render();return}
  if(t.id==='cinDetail'){var gd=byId(S.open);doCheckin(gd,S.today,S.np).then(function(){toast('เช็คอิน '+S.np+' คน ✓')}).catch(fail);return}
  if(t.id==='addNote'){
    var g3=byId(S.open);if(!g3)return;
    if(S.busy)return toast('รอย่อรูปให้เสร็จก่อน');
    var o={detail:$('nDetail').value.trim(),interest:$('nInterest').value.trim(),houses:S.nh.slice(),media:S.nm,pax:S.np,nickname:$('gNick')?$('gNick').value.trim():undefined};
    if(S.pc==='yes'&&!(g3.photoConsent&&g3.photoConsent.given))o.photoConsent=consentRecord();
    if(S.ph.length)o.photos=photoObjs();
    if(S.nb&&S.nb!==g3.budget)o.budgetSet=S.nb;
    if(g3.type===AG){o.name=$('aName').value.trim();o.company=$('aCompany').value.trim()}
    if($('aPhone')&&$('aPhone').value.trim()){var nph=normPhone($('aPhone').value);
      if(nph.length<9)return toast('เบอร์ไม่ครบ ตรวจอีกครั้ง');
      var dupG=G.filter(function(c){return c.phone===nph&&c.id!==g3.id})[0];
      if(dupG)return toast('เบอร์นี้มีของ '+guestName(dupG)+' แล้ว');
      o.phone=nph}
    if(S.today)o.checkinDay=S.today;
    t.disabled=true;
    doSaveNote(g3,o).then(function(){S.open=null;S.q='';resetPhotoState();S.noRestore=true;toast('บันทึกแล้ว ✓');render();window.scrollTo(0,0)}).catch(function(er){t.disabled=false;fail(er)});return}
  if(t.id==='fSave'){
    var nm=$('fName').value.trim(),ph=normPhone($('fPhone').value),co=$('fCompany')?$('fCompany').value.trim():'';
    if(!nm)return toast(S.type===AG?'ใส่ชื่อ Agent':'ใส่ชื่อ');if(S.type===AG&&!co)return toast('ใส่ชื่อบริษัท');if(ph.length<9)return toast('ใส่เบอร์ให้ครบ');
    if(!$('fPdpa').checked)return toast('ต้องติ๊กแจ้ง PDPA');
    if(S.busy)return toast('รอย่อรูปให้เสร็จก่อน');
    t.disabled=true;
    doCreateWalkin({type:S.type,name:nm,nickname:$('fNick')?$('fNick').value.trim():'',company:co,phone:ph,pax:S.np,media:S.nm,budget:S.nb,
      photos:S.ph.length?photoObjs():[],photoConsent:S.pc==='yes'?consentRecord():null}).then(function(r){
      S.newOpen=false;S.q='';S.flt='all';S.open=r.id;S.nh=[];resetPhotoState();S.noRestore=true;
      var gg=byId(r.id);S.nb=gg?(gg.budget||''):S.nb;
      toast(r.existing?'เบอร์นี้มีอยู่แล้ว เปิดข้อมูลเดิมให้':'เพิ่มแล้ว ✓ กรอกข้อมูลต่อได้เลย');render();window.scrollTo(0,0);
    }).catch(function(er){t.disabled=false;fail(er)});return}
  if(t.id==='impGo'&&S.imp&&S.imp.add){
    t.disabled=true;var list=S.imp.add.slice(),done=0;
    (function next(){
      if(!list.length){toast('นำเข้าสำเร็จ '+done+' ราย ✓');S.imp=null;render();return}
      var chunk=list.splice(0,400),b=db.batch();
      chunk.forEach(function(d){var id=d._id,c={};Object.keys(d).forEach(function(k){if(k!=='_id')c[k]=d[k]});b.set(ref(id),c)});
      b.commit().then(function(){done+=chunk.length;next()}).catch(function(er){fail(er);t.disabled=false});
    })();return}
  if(t.id==='expGo'){exportCSV();return}
});
document.addEventListener('change',function(e){
  if(e.target.id==='phCam'||e.target.id==='phFile'){var fs=e.target.files;addPhotoFiles(fs);e.target.value='';return}
  if(e.target.id==='impFile'){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){S.imp=buildImport(String(r.result));S.noRestore=true;render()};r.readAsText(f,'utf-8')}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='loginForm'){e.preventDefault();S.err='';
    var persist=$('lgRem').checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION;
    var em=$('lgEmail').value.trim(),pw=$('lgPw').value;
    auth.setPersistence(persist).then(function(){return auth.signInWithEmailAndPassword(em,pw)}).catch(function(er){S.err='เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง';render()});
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var p=e.target.selectionStart;S.noRestore=false;render();var q=$('q');if(q){q.focus();q.setSelectionRange(p,p)}}
  if(e.target.id==='fPhone'){var ph=normPhone(e.target.value),m=ph.length>=9&&G.filter(function(c){return c.phone===ph})[0];$('dupHint').innerHTML=m?'<span style="color:var(--err)">เบอร์นี้มีแล้ว: '+esc(guestName(m))+' — กดบันทึกเพื่อเปิดข้อมูลเดิม</span>':''}
});
window.addEventListener('online',function(){S.online=true;softRender()});
window.addEventListener('offline',function(){S.online=false;softRender()});

/* ---------- Boot ---------- */
function startListen(){
  if(unsub)unsub();
  unsub=db.collection(COLL).onSnapshot({includeMetadataChanges:true},function(snap){
    G=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
    S.pending=snap.metadata.hasPendingWrites;S.err='';softRender();
  },function(err){S.err='โหลดรายชื่อไม่สำเร็จ: '+(err&&err.code==='permission-denied'?'ยังไม่ได้ตั้งสิทธิ์อ่าน/เขียนคอลเลกชันของโหมดอีเวนต์ (แจ้งผู้ดูแลระบบ)':(err&&err.message||err));render()});
}
function syncClock(){
  return fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(function(r){var d=r.headers.get('Date');if(d){var ms=Date.parse(d);if(!isNaN(ms))S.offsetMs=ms-Date.now()}}).catch(function(){});
}
function boot(){
  try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  }catch(e){$('root').innerHTML='<div class="loading">เชื่อมต่อ Firebase ไม่สำเร็จ ลองรีเฟรชหน้านี้</div>';return}
  S.online=navigator.onLine!==false;
  auth.onAuthStateChanged(function(user){
    if(!user){S.user=null;S.me='';S.ready=true;if(unsub){unsub();unsub=null}G=[];render();return}
    db.collection('profiles').doc(user.uid).get().then(function(snap){
      if(!snap.exists){auth.signOut();S.err='บัญชีนี้ไม่มีสิทธิ์ใช้งาน กรุณาติดต่อผู้ดูแลระบบ';return}
      var p=snap.data()||{};
      S.user=user;S.me=p.displayName||user.email;S.isAdmin=!!p.isAdmin;
      syncClock().then(function(){computeToday();S.ready=true;startListen();render();
        setInterval(function(){var was=S.today;computeToday();if(was!==S.today)softRender()},60000)});
    }).catch(function(er){S.ready=true;S.err='โหลดข้อมูลผู้ใช้ไม่สำเร็จ: '+(er&&er.message||er);render()});
  });
}
render();boot();
})();
</script>
