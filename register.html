<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PATTA GRAND OPENING - ลงทะเบียนเข้างาน / Registration</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
:root{--bg:#efe8da;--bg2:#cdb99c;--card:#faf6ee;--ink:#3a2318;--mut:#7a6554;--line:#d9cdb8;--pri:#41241a;--onpri:#f6eee0;--hd:#41241a;--hdt:#f3ead9;--err:#9b2c1c;--okbg:#e6dfc9;--ok:#4a5a2a;--warnbg:#f1e3c4;--warn:#6b4a1a}
@media (prefers-color-scheme:dark){:root{--bg:#2a1a13;--bg2:#1c110c;--card:#38251b;--ink:#f1e8d8;--mut:#bfa98f;--line:#55402f;--pri:#d9bf9a;--onpri:#2a1a13;--hd:#1c110c;--hdt:#f1e8d8;--err:#f0a08a;--okbg:#4a3a22;--ok:#e8d9a8;--warnbg:#4a3a22;--warn:#f0d9a0}}
*{box-sizing:border-box}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg) 0,var(--bg) 35%,var(--bg2) 100%) fixed;color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:16px;line-height:1.55}
header.ev{background:var(--hd);color:var(--hdt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header.ev .t{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
header.ev .s{font-size:12px;opacity:.9;letter-spacing:.06em}
.lang{display:flex;gap:4px}
.lang button{border:1px solid rgba(243,234,217,.55);background:transparent;color:var(--hdt);border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--hdt);color:var(--hd)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 48px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
label:first-child{margin-top:0}
.req{color:var(--err)}
.hint{font-size:12px;color:var(--mut);font-weight:400}
input[type=text],input[type=tel]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px;user-select:none}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:22px;font-weight:700;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:20px}
.pdpa{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;margin-top:16px;font-size:13px}
.pdpa .pt{font-weight:700;color:var(--ink);margin-bottom:6px}
.pdpa .px{max-height:170px;overflow:auto;white-space:pre-wrap;line-height:1.6}
.pdpa a{color:var(--pri);font-weight:700;word-break:break-all}
.consent-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:12px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.consent-btn .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px}
.consent-btn.on{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.consent-btn.on .ck{border-color:var(--onpri);background:var(--onpri);color:var(--pri)}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:12px}
.consent input{width:22px;height:22px;margin-top:2px;flex:none}
.err{color:var(--err);font-size:13px;margin-top:4px;min-height:0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:700;font-size:17px;letter-spacing:.04em;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.done{text-align:center;padding:26px 16px}
.done .tick{width:60px;height:60px;border-radius:50%;background:var(--okbg);color:var(--ok);font-size:34px;line-height:60px;margin:0 auto 12px}
.done h2{margin:0 0 8px;font-size:20px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="ev">
  <div><div class="t" data-t="title"></div><div class="s" data-t="sub"></div></div>
  <div class="lang"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>
</header>
<div class="wrap">
  <div class="banner" id="testBanner" hidden data-t="testBanner"></div>

  <form class="card" id="f" novalidate>
    <label data-t="who"></label>
    <div class="chips" id="fType"><div class="chip on" data-v="customer" data-t="customer"></div><div class="chip" data-v="agent" data-t="agent"></div></div>

    <label for="name"><span data-t="name"></span> <span class="req">*</span></label>
    <input type="text" id="name" maxlength="120" autocomplete="name">
    <div class="err" id="eName"></div>

    <label for="nick"><span data-t="nick"></span> <span class="hint" data-t="optional"></span></label>
    <input type="text" id="nick" maxlength="40" autocomplete="nickname">

    <div id="coBox" hidden>
      <label for="company"><span data-t="company"></span> <span class="req">*</span></label>
      <input type="text" id="company" maxlength="120" autocomplete="organization">
      <div class="err" id="eCo"></div>
    </div>

    <label for="phone"><span data-t="phone"></span> <span class="req">*</span></label>
    <input type="tel" id="phone" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx">
    <div class="err" id="ePhone"></div>

    <label data-t="pax"></label>
    <div class="stepper"><button type="button" id="pMinus" aria-label="-">−</button><b id="pVal">1</b><button type="button" id="pPlus" aria-label="+">+</button></div>

    <label><span data-t="media"></span> <span class="hint" data-t="optional"></span></label>
    <div class="chips" id="fMedia"></div>

    <div class="pdpa"><div class="pt" data-t="pdpaTitle"></div><div class="px"><span data-t="pdpaText"></span> <a href="https://patta.co.th/th/privacy-policy/" target="_blank" rel="noopener" data-t="pdpaLink"></a></div></div>
    <button type="button" class="consent-btn" id="pdpaBtn" aria-pressed="false"><span class="ck">✓</span><span data-t="pdpaCheck"></span></button>
    <div class="err" id="ePdpa"></div>

    <input type="text" id="website" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button class="btn" id="go" type="submit" data-t="submit"></button>
    <div class="err" id="eSend"></div>
  </form>

  <div class="card done" id="done" hidden>
    <div class="tick">✓</div>
    <h2 data-t="doneTitle"></h2>
    <div data-t="doneBody"></div>
    <button class="btn sec" id="again" type="button" data-t="again"></button>
  </div>

  <div class="card done" id="closed" hidden>
    <h2 data-t="closedTitle"></h2>
    <div data-t="closedBody"></div>
  </div>
  <noscript><div class="card">กรุณาเปิด JavaScript / Please enable JavaScript</div></noscript>
</div>
<script>
(function(){
/* ---------- Settings ---------- */
var FIREBASE_CONFIG={
    apiKey: "AIzaSyDYtAeOYth7J0bPZVunZ0RQpPAOM2K4eqA",
    authDomain: "patta-walk-in.firebaseapp.com",
    projectId: "patta-walk-in",
    storageBucket: "patta-walk-in.firebasestorage.app",
    messagingSenderId: "179665748747",
    appId: "1:179665748747:web:4c81a7c55ffac3f0fb180e"
  };
var params=new URLSearchParams(location.search);
var TEST=params.get('test')==='1';              // ?test=1 → เขียนลงคิวทดสอบ event_selfreg_test
var COLL=TEST?'event_selfreg_test':'event_selfreg';
var OPEN_DATES=['2026-11-20','2026-11-21'];       // เปิดรับเฉพาะวันงาน (เวลาไทย) — กฎ Firestore ก็ล็อกช่วงเวลานี้เช่นกัน
var PDPA_VER='selfreg-policylink-v1';                  // ร่างข้อความ: ต้องให้ฝ่ายกฎหมาย/ผู้บริหารอนุมัติก่อนใช้จริง แล้วเปลี่ยนเลขเวอร์ชัน
var MEDIA=[['Facebook','Facebook'],['Google','Google'],['ป้ายโฆษณา','Billboard / signage'],['เพื่อน/คนรู้จักแนะนำ','Friend / referral'],['Line OA','LINE OA'],['Agency','Agency / Property agent'],['ขับรถผ่านโครงการ','Drove past the project'],['อื่นๆ','Other']];

var T={
th:{title:'ลงทะเบียนเข้างาน',sub:'PATTA GRAND OPENING · 20–21 พ.ย. 2569',who:'ท่านเป็น',customer:'ลูกค้า',agent:'Property Agent',
 name:'ชื่อ–นามสกุล',nick:'ชื่อเล่น',optional:'(ไม่บังคับ)',company:'ชื่อบริษัท',phone:'เบอร์โทรศัพท์',pax:'จำนวนผู้เข้าร่วม (รวมตัวท่าน)',media:'ทราบข่าวงานนี้จากช่องทางไหน',
 pdpaTitle:'ความยินยอมการเก็บและใช้ข้อมูลส่วนบุคคล (PDPA)',
 pdpaText:'กรุณาอ่านรายละเอียดนโยบายความเป็นส่วนตัวของ PATTA Development ที่ลิงก์ด้านล่างก่อนกดยินยอม ข้อมูลที่กรอกจะใช้เพื่อลงทะเบียนเข้างานและติดต่อกลับเกี่ยวกับโครงการเท่านั้น',pdpaLink:'patta.co.th/th/privacy-policy',
 pdpaCheck:'ข้าพเจ้าอ่านและยินยอมให้เก็บและใช้ข้อมูลส่วนบุคคลตามนโยบายความเป็นส่วนตัว',submit:'ลงทะเบียน',sending:'กำลังส่ง…',
 slow:'สัญญาณอ่อน ข้อมูลจะส่งอัตโนมัติเมื่อมีสัญญาณ กรุณาอย่าปิดหน้านี้',
 doneTitle:'ลงทะเบียนเรียบร้อย',doneBody:'กรุณาแจ้งชื่อของท่านกับเจ้าหน้าที่ที่โต๊ะลงทะเบียน เพื่อยืนยันและรับการต้อนรับ',again:'ลงทะเบียนเพิ่มอีกท่าน',
 closedTitle:'ฟอร์มเปิดรับเฉพาะวันงาน',closedBody:'เปิดให้ลงทะเบียนวันที่ 20–21 พฤศจิกายน 2569 เท่านั้น',
 errName:'กรุณากรอกชื่อ–นามสกุล',errCo:'กรุณากรอกชื่อบริษัท',errPhone:'เบอร์โทรไม่ถูกต้อง (ตัวเลข 9–15 หลัก)',errPdpa:'กรุณากดปุ่มยินยอมก่อนลงทะเบียน',
 errSend:'ส่งข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง หรือแจ้งเจ้าหน้าที่',errPerm:'ส่งข้อมูลไม่ได้ในขณะนี้ (อาจอยู่นอกวันงาน) กรุณาแจ้งเจ้าหน้าที่',
 testBanner:'โหมดทดสอบ: ข้อมูลจะไม่เข้าระบบจริง'},
en:{title:'Event Registration',sub:'PATTA GRAND OPENING · 20–21 Nov 2026',who:'I am a',customer:'Customer',agent:'Property Agent',
 name:'Full name',nick:'Nickname',optional:'(optional)',company:'Company name',phone:'Phone number',pax:'Number of guests (including you)',media:'How did you hear about this event?',
 pdpaTitle:'Personal data consent (PDPA)',
 pdpaText:'Please read the privacy policy of PATTA Development at the link below before you consent. The information you provide is used only to register you for the event and to follow up about our projects.',pdpaLink:'patta.co.th/th/privacy-policy',
 pdpaCheck:'I have read the privacy policy and I consent to the collection and use of my personal data',submit:'Register',sending:'Sending…',
 slow:'Weak signal — your registration will be sent automatically once connected. Please keep this page open.',
 doneTitle:'Registration received',doneBody:'Please tell the staff at the registration desk your name so they can confirm and welcome you.',again:'Register another guest',
 closedTitle:'Registration is open on event days only',closedBody:'You can register on 20–21 November 2026 only.',
 errName:'Please enter your full name',errCo:'Please enter your company name',errPhone:'Invalid phone number (9–15 digits)',errPdpa:'Please press the consent button to register',
 errSend:'Could not send. Please try again or ask the staff.',errPerm:'Cannot submit right now (possibly outside the event days). Please ask the staff.',
 testBanner:'Test mode: data does not go into the real system'}
};

/* ---------- Helpers ---------- */
function $(id){return document.getElementById(id)}
var lang='th';
try{var sv=localStorage.getItem('selfreg_lang');if(sv==='th'||sv==='en')lang=sv;else if(!/^th/i.test(navigator.language||'th'))lang='en'}catch(e){}
function t(k){return (T[lang]&&T[lang][k])||T.th[k]||''}
function normPhone(s){var d=String(s||'').replace(/\D/g,'');if(d.indexOf('66')===0&&d.length===11)d='0'+d.slice(2);if(d.length===9&&d.charAt(0)!=='0')d='0'+d;return d}
function bkkDate(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})}

var st={type:'customer',pax:1,media:'',pdpa:false};
function setPdpa(v){st.pdpa=v;$('pdpaBtn').classList.toggle('on',v);$('pdpaBtn').setAttribute('aria-pressed',v?'true':'false');if(v)$('ePdpa').textContent=''}

function applyLang(){
  document.documentElement.lang=lang;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(el){el.textContent=t(el.getAttribute('data-t'))});
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.classList.toggle('on',b.getAttribute('data-lang')===lang)});
  renderMedia();
  var go=$('go');if(!go.disabled)go.textContent=t('submit');
  document.title=lang==='th'?'PATTA GRAND OPENING - ลงทะเบียนเข้างาน':'PATTA GRAND OPENING - Registration';
}
function renderMedia(){
  var box=$('fMedia');box.textContent='';
  MEDIA.forEach(function(m){var c=document.createElement('div');c.className='chip'+(st.media===m[0]?' on':'');c.setAttribute('data-m',m[0]);c.textContent=lang==='th'?m[0]:m[1];box.appendChild(c)});
}
function clearErrors(){['eName','eCo','ePhone','ePdpa','eSend'].forEach(function(i){$(i).textContent=''})}
function setOpenState(){
  var open=TEST||OPEN_DATES.indexOf(bkkDate())>-1;
  $('f').hidden=!open;$('closed').hidden=open;$('testBanner').hidden=!TEST;
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target,x;
  if((x=el.closest('.lang button'))){lang=x.getAttribute('data-lang');try{localStorage.setItem('selfreg_lang',lang)}catch(er){}applyLang();return}
  if((x=el.closest('#fType .chip'))){st.type=x.getAttribute('data-v');[].forEach.call(document.querySelectorAll('#fType .chip'),function(c){c.classList.toggle('on',c.getAttribute('data-v')===st.type)});$('coBox').hidden=st.type!=='agent';return}
  if((x=el.closest('#fMedia .chip'))){var v=x.getAttribute('data-m');st.media=st.media===v?'':v;renderMedia();return}
  if((x=el.closest('#pdpaBtn'))){setPdpa(!st.pdpa);return}
  if(el.id==='pMinus'){st.pax=Math.max(1,st.pax-1);$('pVal').textContent=st.pax;return}
  if(el.id==='pPlus'){st.pax=Math.min(20,st.pax+1);$('pVal').textContent=st.pax;return}
  if(el.id==='again'){$('done').hidden=true;$('f').reset();st.type='customer';st.pax=1;st.media='';setPdpa(false);$('pVal').textContent='1';$('coBox').hidden=true;[].forEach.call(document.querySelectorAll('#fType .chip'),function(c){c.classList.toggle('on',c.getAttribute('data-v')==='customer')});renderMedia();clearErrors();setOpenState();window.scrollTo(0,0)}
});

var db=null;
try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){console.error(e)}
var sending=false;

$('f').addEventListener('submit',function(e){
  e.preventDefault();if(sending)return;clearErrors();
  var name=$('name').value.trim(),nick=$('nick').value.trim(),company=$('company').value.trim(),phone=normPhone($('phone').value),ok=true;
  if(name.length<2){$('eName').textContent=t('errName');ok=false}
  if(st.type==='agent'&&!company){$('eCo').textContent=t('errCo');ok=false}
  if(phone.length<9||phone.length>15){$('ePhone').textContent=t('errPhone');ok=false}
  if(!st.pdpa){$('ePdpa').textContent=t('errPdpa');ok=false}
  if(!ok){var first=document.querySelector('.err:not(:empty)');if(first)first.scrollIntoView({block:'center',behavior:'smooth'});return}
  if($('website').value){$('f').hidden=true;$('done').hidden=false;return}   // ช่องกับดักบอท: แกล้งทำเป็นสำเร็จ ไม่บันทึก
  if(!db){$('eSend').textContent=t('errSend');return}
  var doc={type:st.type,name:name,nickname:nick,company:st.type==='agent'?company:'',phone:phone,pax:st.pax,media:st.media,lang:lang,
    pdpa:{accepted:true,version:PDPA_VER,lang:lang},status:'pending',source:'self',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  sending=true;var go=$('go');go.disabled=true;go.textContent=t('sending');
  var slowT=setTimeout(function(){$('eSend').textContent=t('slow')},12000);
  db.collection(COLL).add(doc).then(function(){
    clearTimeout(slowT);sending=false;go.disabled=false;go.textContent=t('submit');$('eSend').textContent='';
    $('f').hidden=true;$('done').hidden=false;window.scrollTo(0,0);
  }).catch(function(err){
    clearTimeout(slowT);sending=false;go.disabled=false;go.textContent=t('submit');
    $('eSend').textContent=(err&&err.code==='permission-denied')?t('errPerm'):t('errSend');
  });
});

applyLang();setOpenState();
})();
</script>
</body>
</html>
